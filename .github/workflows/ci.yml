name: CI - Tests y Cobertura
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Ejecutar Tests y Generar Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Dar permisos al gradlew
        run: chmod +x gradlew
      - name: Cachear dependencias de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Compilar el proyecto
        run: ./gradlew classes --no-daemon
      - name: Ejecutar tests y generar informe JaCoCo
        run: ./gradlew test jacocoTestReport --no-daemon
      - name: Verificar umbral mínimo de cobertura (70%)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon
      - name: Publicar resultados de los tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados JUnit
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false
      - name: Publicar informe de cobertura JaCoCo
        uses: madrapps/jacoco-report@v1.6.1
        if: always()
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/xml/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 60
          title: '📊 Cobertura de Tests - DeustoRestaurant'
          update-comment: true
      - name: Subir informe HTML como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-html
          path: build/reports/jacoco/html/
          retention-days: 30
      - name: Subir resultados de tests como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results/
          retention-days: 30