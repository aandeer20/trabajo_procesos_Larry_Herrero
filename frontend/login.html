<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — DeustoRestaurant</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <nav>
        <a class="nav-logo" href="index.html">Deusto<span>Restaurant</span></a>
        <div class="nav-buttons">
            <a href="login.html" class="btn btn-login active-nav">Iniciar sesión</a>
            <a href="registro.html" class="btn btn-register">Registrarse</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Iniciar sesión</h2>
            <form id="form-login" onsubmit="submitLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="tu@email.com" required autofocus>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <p class="error-msg" id="login-error"></p>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            <div class="auth-switch">
                ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
