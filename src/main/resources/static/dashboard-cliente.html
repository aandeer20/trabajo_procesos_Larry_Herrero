<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel — DeustoRestaurant</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .tabs { display:flex; gap:8px; margin-bottom:36px; border-bottom:2px solid #e8e3da; }
        .tab-btn {
            padding:12px 28px; background:transparent; border:none; border-bottom:3px solid transparent;
            font-family:'Georgia',serif; font-size:1rem; color:#888; cursor:pointer; transition:all 0.2s; margin-bottom:-2px;
        }
        .tab-btn.active { color:#1a1a1a; border-bottom-color:#c9a84c; font-weight:bold; }
        .tab-btn:hover:not(.active) { color:#555; }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-group.full { grid-column:1/-1; }
        .form-group label { font-size:0.85rem; color:#555; font-weight:bold; }
        .form-group input, .form-group select, .form-group textarea {
            padding:10px 14px; border:1px solid #ddd; border-radius:4px;
            font-family:'Georgia',serif; font-size:0.95rem; outline:none; transition:border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#c9a84c; }
        .form-group textarea { resize:vertical; min-height:80px; }
        .btn-submit {
            padding:12px 32px; background:#c9a84c; color:#1a1a1a; border:none; border-radius:4px;
            font-family:'Georgia',serif; font-size:1rem; font-weight:bold; cursor:pointer; transition:background 0.2s;
        }
        .btn-submit:hover { background:#b8973b; }
        .form-card { background:#fff; border-radius:8px; padding:36px; box-shadow:0 2px 12px rgba(0,0,0,0.07); max-width:620px; }
        .success-msg { color:#2e7d32; font-size:0.9rem; margin-top:10px; display:block; }
        .error-msg   { color:#c0392b; font-size:0.9rem; margin-top:10px; display:block; }
        table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.07); }
        thead { background:#1a1a1a; color:#c9a84c; }
        thead th { padding:14px 20px; text-align:left; font-size:0.85rem; letter-spacing:0.5px; }
        tbody tr { border-bottom:1px solid #f0ece4; transition:background 0.15s; }
        tbody tr:hover { background:#faf8f5; }
        tbody td { padding:14px 20px; font-size:0.92rem; color:#333; }
        .empty-msg { text-align:center; color:#aaa; padding:32px; font-size:0.95rem; }
        .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.78rem; font-weight:bold; }
        .badge-confirmada { background:#e8f5e9; color:#2e7d32; }
        .badge-pendiente  { background:#fff8e1; color:#f57f17; }
        .badge-completada { background:#e3f2fd; color:#1565c0; }
        .badge-cancelada  { background:#fce4ec; color:#c62828; }
        .badge-no_show    { background:#f3e5f5; color:#6a1b9a; }
        .btn-cancelar {
            padding:6px 14px; background:transparent; border:1px solid #c62828; color:#c62828;
            border-radius:4px; font-family:'Georgia',serif; font-size:0.82rem; cursor:pointer; transition:all 0.2s;
        }
        .btn-cancelar:hover { background:#c62828; color:#fff; }
        .seccion-titulo { font-size:1.3rem; color:#1a1a1a; margin-bottom:24px; border-bottom:2px solid #c9a84c; padding-bottom:8px; }
        .disponibilidad-info {
            background:#faf8f5; border-radius:6px; padding:12px 16px;
            display:none; align-items:center; gap:12px; margin-bottom:8px;
        }
        .disponibilidad-info.visible { display:flex; }
        .disponibilidad-numero { font-size:1.8rem; font-weight:bold; color:#c9a84c; }
        .disponibilidad-texto { font-size:0.88rem; color:#555; }
        .disponibilidad-texto.lleno { color:#c62828; font-weight:bold; }
    </style>
</head>
<body>
    <nav>
        <a class="nav-logo" href="index.html">Deusto<span>Restaurant</span></a>
        <div class="dashboard-nav-user">
            <span id="nav-nombre"></span>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </nav>
    <main class="dashboard-main">
        <h1>Hola, <span id="bienvenida-nombre"></span></h1>
        <p class="subtitle">¿Qué quieres hacer hoy?</p>
        <div class="tabs">
            <button class="tab-btn active" data-tab="crear" onclick="cambiarTab('crear')">🍽 Crear reserva</button>
            <button class="tab-btn" data-tab="mis-reservas" onclick="cambiarTab('mis-reservas')">📋 Mis reservas</button>
        </div>

        <!-- CREAR RESERVA -->
        <div class="tab-panel active" id="tab-crear">
            <div class="form-card">
                <h2 class="seccion-titulo">Nueva reserva</h2>
                <form id="form-reserva" onsubmit="crearReserva(event)">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label>Restaurante</label>
                            <select id="res-restaurante" required onchange="comprobarDisponibilidad()">
                                <option value="">Selecciona un restaurante...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fecha</label>
                            <input type="date" id="res-fecha" required onchange="comprobarDisponibilidad()">
                        </div>
                        <div class="form-group">
                            <label>Turno</label>
                            <select id="res-turno" required onchange="comprobarDisponibilidad()">
                                <option value="">— Selecciona —</option>
                                <option value="COMIDA">🍽 Comida (13:00 – 16:00)</option>
                                <option value="CENA">🌙 Cena (20:00 – 23:00)</option>
                            </select>
                        </div>
                        <div class="form-group full">
                            <div class="disponibilidad-info" id="disp-info">
                                <div class="disponibilidad-numero" id="disp-numero">—</div>
                                <div class="disponibilidad-texto" id="disp-texto">plazas disponibles</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Número de comensales</label>
                            <input type="number" id="res-comensales" min="1" max="20" placeholder="Ej: 2" required>
                        </div>
                        <div class="form-group full">
                            <label>Observaciones (opcional)</label>
                            <textarea id="res-obs" placeholder="Alergias, silla para bebé, ocasión especial..."></textarea>
                        </div>
                    </div>
                    <br>
                    <button type="submit" class="btn-submit">Reservar mesa</button>
                    <span class="error-msg" id="res-error"></span>
                    <span class="success-msg" id="res-ok"></span>
                </form>
            </div>
        </div>

        <!-- MIS RESERVAS -->
        <div class="tab-panel" id="tab-mis-reservas">
            <h2 class="seccion-titulo">Mis reservas</h2>
            <table>
                <thead>
                    <tr><th>Restaurante</th><th>Fecha</th><th>Turno</th><th>Comensales</th><th>Estado</th><th></th></tr>
                </thead>
                <tbody id="tabla-reservas">
                    <tr><td colspan="6" class="empty-msg">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        if (!usuario || usuario.rol !== 'CLIENTE') window.location.href = 'login.html';

        document.getElementById('nav-nombre').textContent = usuario.nombre + ' ' + (usuario.apellidos || '');
        document.getElementById('bienvenida-nombre').textContent = usuario.nombre;
        document.getElementById('res-fecha').min = new Date().toISOString().split('T')[0];
        document.getElementById('res-fecha').value = new Date().toISOString().split('T')[0];

        let restaurantes = [];

        async function cargarRestaurantes() {
            try {
                const res = await fetch(`${API_BASE}/restaurantes/activos`);
                restaurantes = await res.json();
                const select = document.getElementById('res-restaurante');
                restaurantes.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.nombre + (r.direccion ? ' — ' + r.direccion : '');
                    opt.dataset.aforoComida = r.aforoMaximoComida;
                    opt.dataset.aforoCena = r.aforoMaximoCena;
                    select.appendChild(opt);
                });
            } catch (e) { console.error('Error cargando restaurantes:', e); }
        }

        async function comprobarDisponibilidad() {
            const restauranteId = document.getElementById('res-restaurante').value;
            const fecha = document.getElementById('res-fecha').value;
            const turno = document.getElementById('res-turno').value;
            if (!restauranteId || !fecha || !turno) return;

            try {
                const res = await fetch(`${API_BASE}/reservas/turno?restauranteId=${restauranteId}&fecha=${fecha}&turno=${turno}`);
                const reservas = await res.json();

                const select = document.getElementById('res-restaurante');
                const opt = select.options[select.selectedIndex];
                const aforoMax = turno === 'COMIDA'
                    ? parseInt(opt.dataset.aforoComida)
                    : parseInt(opt.dataset.aforoCena);

                const ocupadas = reservas
                    .filter(r => r.estado !== 'CANCELADA')
                    .reduce((acc, r) => acc + r.numComensales, 0);
                const libres = Math.max(0, aforoMax - ocupadas);

                const infoEl  = document.getElementById('disp-info');
                const numEl   = document.getElementById('disp-numero');
                const textoEl = document.getElementById('disp-texto');

                numEl.textContent = libres;
                infoEl.classList.add('visible');

                if (libres === 0) {
                    textoEl.textContent = 'Sin plazas disponibles para este turno';
                    textoEl.className = 'disponibilidad-texto lleno';
                } else {
                    textoEl.textContent = `plazas disponibles de ${aforoMax}`;
                    textoEl.className = 'disponibilidad-texto';
                }
                document.getElementById('res-comensales').max = libres;
            } catch (e) { console.error('Error disponibilidad:', e); }
        }

        function cambiarTab(nombre) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === nombre));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + nombre));
            if (nombre === 'mis-reservas') cargarMisReservas();
        }

        async function crearReserva(e) {
            e.preventDefault();
            const errorEl = document.getElementById('res-error');
            const okEl    = document.getElementById('res-ok');
            errorEl.textContent = ''; okEl.textContent = '';

            const body = {
                fecha: document.getElementById('res-fecha').value,
                turno: document.getElementById('res-turno').value,
                numComensales: parseInt(document.getElementById('res-comensales').value),
                observaciones: document.getElementById('res-obs').value.trim(),
                clienteId: usuario.id,
                restauranteId: parseInt(document.getElementById('res-restaurante').value)
            };

            try {
                const res = await fetch(`${API_BASE}/reservas`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (res.status === 400) { errorEl.textContent = 'No quedan plazas disponibles para ese turno.'; return; }
                if (!res.ok) { errorEl.textContent = 'Error del servidor.'; return; }
                okEl.textContent = '¡Reserva creada con éxito!';
                document.getElementById('form-reserva').reset();
                document.getElementById('res-fecha').min = new Date().toISOString().split('T')[0];
                document.getElementById('res-fecha').value = new Date().toISOString().split('T')[0];
                cargarRestaurantes();
            } catch { errorEl.textContent = 'No se pudo conectar con el servidor.'; }
        }

        async function cargarMisReservas() {
            const tbody = document.getElementById('tabla-reservas');
            tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">Cargando...</td></tr>';
            try {
                const res = await fetch(`${API_BASE}/reservas/cliente/${usuario.id}`);
                const reservas = await res.json();
                if (!reservas.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">No tienes reservas aún.</td></tr>';
                    return;
                }
                tbody.innerHTML = reservas.map(r => `
                    <tr>
                        <td>${r.nombreRestaurante || '—'}</td>
                        <td>${r.fecha}</td>
                        <td>${r.turno === 'COMIDA' ? '🍽 Comida' : '🌙 Cena'}</td>
                        <td>${r.numComensales} personas</td>
                        <td><span class="badge badge-${r.estado.toLowerCase()}">${r.estado}</span></td>
                        <td>${(r.estado === 'PENDIENTE' || r.estado === 'CONFIRMADA')
                            ? `<button class="btn-cancelar" onclick="cancelar(${r.id})">Cancelar</button>` : ''}</td>
                    </tr>`).join('');
            } catch { tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">Error al cargar.</td></tr>'; }
        }

        async function cancelar(id) {
            if (!confirm('¿Seguro que quieres cancelar esta reserva?')) return;
            await fetch(`${API_BASE}/reservas/${id}/cancelar`, { method: 'PUT' });
            cargarMisReservas();
        }

        function cerrarSesion() { sessionStorage.removeItem('usuario'); window.location.href = 'login.html'; }

        cargarRestaurantes();
    </script>
</body>
</html>
