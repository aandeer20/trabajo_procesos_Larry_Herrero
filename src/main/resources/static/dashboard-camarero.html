<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Camarero — DeustoRestaurant</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .tabs { display:flex; gap:8px; margin-bottom:36px; border-bottom:2px solid #e8e3da; }
        .tab-btn {
            padding:12px 28px; background:transparent; border:none; border-bottom:3px solid transparent;
            font-family:'Georgia',serif; font-size:1rem; color:#888; cursor:pointer; transition:all 0.2s; margin-bottom:-2px;
        }
        .tab-btn.active { color:#1a1a1a; border-bottom-color:#c9a84c; font-weight:bold; }
        .tab-btn:hover:not(.active) { color:#555; }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-group.full { grid-column:1/-1; }
        .form-group label { font-size:0.85rem; color:#555; font-weight:bold; }
        .form-group input, .form-group select, .form-group textarea {
            padding:10px 14px; border:1px solid #ddd; border-radius:4px;
            font-family:'Georgia',serif; font-size:0.95rem; outline:none; transition:border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus { border-color:#c9a84c; }
        .form-group textarea { resize:vertical; min-height:80px; }
        .btn-submit {
            padding:12px 32px; background:#c9a84c; color:#1a1a1a; border:none; border-radius:4px;
            font-family:'Georgia',serif; font-size:1rem; font-weight:bold; cursor:pointer; transition:background 0.2s;
        }
        .btn-submit:hover { background:#b8973b; }
        .form-card { background:#fff; border-radius:8px; padding:36px; box-shadow:0 2px 12px rgba(0,0,0,0.07); max-width:620px; }
        .success-msg { color:#2e7d32; font-size:0.9rem; margin-top:10px; display:block; }
        .error-msg   { color:#c0392b; font-size:0.9rem; margin-top:10px; display:block; }
        table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.07); }
        thead { background:#1a1a1a; color:#c9a84c; }
        thead th { padding:14px 20px; text-align:left; font-size:0.85rem; letter-spacing:0.5px; }
        tbody tr { border-bottom:1px solid #f0ece4; transition:background 0.15s; }
        tbody tr:hover { background:#faf8f5; }
        tbody td { padding:14px 20px; font-size:0.92rem; color:#333; }
        .empty-msg { text-align:center; color:#aaa; padding:32px; font-size:0.95rem; }
        .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.78rem; font-weight:bold; }
        .badge-confirmada { background:#e8f5e9; color:#2e7d32; }
        .badge-pendiente  { background:#fff8e1; color:#f57f17; }
        .badge-completada { background:#e3f2fd; color:#1565c0; }
        .badge-cancelada  { background:#fce4ec; color:#c62828; }
        .badge-no_show    { background:#f3e5f5; color:#6a1b9a; }
        .filtros { display:flex; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
        .filtros label { font-size:0.85rem; color:#555; font-weight:bold; }
        .filtros input, .filtros select {
            padding:8px 14px; border:1px solid #ddd; border-radius:4px;
            font-family:'Georgia',serif; font-size:0.9rem; outline:none;
        }
        .filtros input:focus, .filtros select:focus { border-color:#c9a84c; }
        .btn-buscar {
            padding:8px 20px; background:#c9a84c; color:#1a1a1a; border:none; border-radius:4px;
            font-family:'Georgia',serif; font-weight:bold; cursor:pointer; transition:background 0.2s;
        }
        .btn-buscar:hover { background:#b8973b; }
        .btn-editar {
            padding:6px 14px; background:transparent; border:1px solid #1565c0; color:#1565c0;
            border-radius:4px; font-family:'Georgia',serif; font-size:0.82rem; cursor:pointer; transition:all 0.2s;
        }
        .btn-editar:hover { background:#1565c0; color:#fff; }
        .seccion-titulo { font-size:1.3rem; color:#1a1a1a; margin-bottom:24px; border-bottom:2px solid #c9a84c; padding-bottom:8px; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; justify-content:center; align-items:center; }
        .modal-overlay.open { display:flex; }
        .modal { background:#fff; border-radius:8px; padding:36px; width:100%; max-width:400px; box-shadow:0 8px 40px rgba(0,0,0,0.2); }
        .modal h3 { font-size:1.2rem; margin-bottom:20px; color:#1a1a1a; }
        .modal-actions { display:flex; gap:12px; margin-top:24px; justify-content:flex-end; }
        .btn-secondary {
            padding:10px 20px; background:transparent; border:1px solid #bbb; color:#555;
            border-radius:4px; font-family:'Georgia',serif; cursor:pointer; transition:all 0.2s;
        }
        .btn-secondary:hover { border-color:#555; color:#333; }
    </style>
</head>
<body>
    <nav>
        <a class="nav-logo" href="index.html">Deusto<span>Restaurant</span></a>
        <div class="dashboard-nav-user">
            <span id="nav-nombre"></span>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </nav>

    <main class="dashboard-main">
        <h1>Panel <span>Camarero</span></h1>
        <p class="subtitle" id="subtitulo"></p>
        <div class="tabs">
            <button class="tab-btn active" data-tab="crear" onclick="cambiarTab('crear')">🍽 Crear reserva</button>
            <button class="tab-btn" data-tab="reservas" onclick="cambiarTab('reservas')">📋 Visualizar reservas</button>
        </div>

        <!-- CREAR RESERVA -->
        <div class="tab-panel active" id="tab-crear">
            <div class="form-card">
                <h2 class="seccion-titulo">Nueva reserva</h2>
                <form id="form-reserva" onsubmit="crearReserva(event)">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label>Restaurante</label>
                            <select id="res-restaurante" required onchange="actualizarRestaurante()">
                                <option value="">Selecciona un restaurante...</option>
                            </select>
                        </div>
                        <div class="form-group full">
                            <label>Cliente</label>
                            <select id="res-cliente" required>
                                <option value="">— Selecciona cliente —</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fecha</label>
                            <input type="date" id="res-fecha" required>
                        </div>
                        <div class="form-group">
                            <label>Turno</label>
                            <select id="res-turno" required>
                                <option value="">— Selecciona —</option>
                                <option value="COMIDA">🍽 Comida (13:00 – 16:00)</option>
                                <option value="CENA">🌙 Cena (20:00 – 23:00)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Número de comensales</label>
                            <input type="number" id="res-comensales" min="1" max="20" placeholder="Ej: 2" required>
                        </div>
                        <div class="form-group full">
                            <label>Observaciones (opcional)</label>
                            <textarea id="res-obs" placeholder="Alergias, silla para bebé..."></textarea>
                        </div>
                    </div>
                    <br>
                    <button type="submit" class="btn-submit">Crear reserva</button>
                    <span class="error-msg" id="res-error"></span>
                    <span class="success-msg" id="res-ok"></span>
                </form>
            </div>
        </div>

        <!-- VISUALIZAR RESERVAS -->
        <div class="tab-panel" id="tab-reservas">
            <h2 class="seccion-titulo">Reservas del restaurante</h2>
            <div class="filtros">
                <label>Restaurante:</label>
                <select id="filtro-restaurante" onchange="cargarReservas()">
                    <option value="">Todos</option>
                </select>
                <label>Fecha:</label>
                <input type="date" id="filtro-fecha">
                <label>Turno:</label>
                <select id="filtro-turno">
                    <option value="">Todos</option>
                    <option value="COMIDA">Comida</option>
                    <option value="CENA">Cena</option>
                </select>
                <button class="btn-buscar" onclick="cargarReservas()">Buscar</button>
            </div>
            <table>
                <thead>
                    <tr><th>Restaurante</th><th>Cliente</th><th>Fecha</th><th>Turno</th><th>Comensales</th><th>Estado</th><th></th></tr>
                </thead>
                <tbody id="tabla-reservas">
                    <tr><td colspan="7" class="empty-msg">Selecciona una fecha para ver reservas.</td></tr>
                </tbody>
            </table>

            <div style="margin-top:2.5rem;">
                <h3 class="seccion-titulo" style="font-size:1.1rem;color:#c62828;display:flex;align-items:center;gap:8px;">
                    <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#f57f17;"></span>
                    Reservas pendientes de confirmar
                </h3>
                <table>
                    <thead>
                        <tr><th>Restaurante</th><th>Cliente</th><th>Fecha</th><th>Turno</th><th>Comensales</th><th>Observaciones</th><th></th></tr>
                    </thead>
                    <tbody id="tabla-pendientes">
                        <tr><td colspan="7" class="empty-msg">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal editar estado -->
    <div class="modal-overlay" id="modal-estado">
        <div class="modal">
            <h3>Cambiar estado de reserva</h3>
            <div class="form-group">
                <label>Nuevo estado</label>
                <select id="nuevo-estado">
                    <option value="PENDIENTE">PENDIENTE</option>
                    <option value="CONFIRMADA">CONFIRMADA</option>
                    <option value="COMPLETADA">COMPLETADA</option>
                    <option value="NO_SHOW">NO_SHOW</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-submit" onclick="guardarEstado()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        if (!usuario || usuario.rol !== 'CAMARERO') window.location.href = 'login.html';

        document.getElementById('nav-nombre').textContent = usuario.nombre + ' ' + (usuario.apellidos || '');
        document.getElementById('subtitulo').textContent = usuario.nombreRestaurante || '';
        document.getElementById('res-fecha').min = new Date().toISOString().split('T')[0];
        document.getElementById('filtro-fecha').value = new Date().toISOString().split('T')[0];

        let restauranteId = null;
        let reservaEditandoId = null;
        let todosRestaurantes = [];

        async function init() {
            try {
                const r = await fetch(`${API_BASE}/restaurantes/activos`);
                todosRestaurantes = await r.json();

                const selRest = document.getElementById('res-restaurante');
                const filtroRest = document.getElementById('filtro-restaurante');
                todosRestaurantes.forEach(rest => {
                    const opt1 = document.createElement('option');
                    opt1.value = rest.id;
                    opt1.textContent = rest.nombre + (rest.direccion ? ' — ' + rest.direccion : '');
                    selRest.appendChild(opt1);

                    const opt2 = document.createElement('option');
                    opt2.value = rest.id;
                    opt2.textContent = rest.nombre;
                    filtroRest.appendChild(opt2);
                });
                if (todosRestaurantes.length) restauranteId = todosRestaurantes[0].id;

                const rc = await fetch(`${API_BASE}/usuarios/rol/CLIENTE`);
                const clientes = await rc.json();
                const sel = document.getElementById('res-cliente');
                clientes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.nombre + ' ' + (c.apellidos || '') + ' — ' + c.email;
                    sel.appendChild(opt);
                });
            } catch(e) { console.error(e); }
        }

        function actualizarRestaurante() {
            restauranteId = parseInt(document.getElementById('res-restaurante').value);
        }

        function cambiarTab(nombre) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === nombre));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + nombre));
            if (nombre === 'reservas') { cargarReservas(); cargarPendientes(); }
        }

        async function crearReserva(e) {
            e.preventDefault();
            const errorEl = document.getElementById('res-error');
            const okEl    = document.getElementById('res-ok');
            errorEl.textContent = ''; okEl.textContent = '';
            if (!restauranteId) { errorEl.textContent = 'Selecciona un restaurante.'; return; }

            const body = {
                fecha: document.getElementById('res-fecha').value,
                turno: document.getElementById('res-turno').value,
                numComensales: parseInt(document.getElementById('res-comensales').value),
                observaciones: document.getElementById('res-obs').value.trim(),
                clienteId: parseInt(document.getElementById('res-cliente').value),
                restauranteId
            };
            try {
                const res = await fetch(`${API_BASE}/reservas`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (res.status === 400) { errorEl.textContent = 'No quedan plazas disponibles para ese turno.'; return; }
                if (!res.ok) { errorEl.textContent = 'Error del servidor.'; return; }
                okEl.textContent = '¡Reserva creada con éxito!';
                document.getElementById('form-reserva').reset();
                document.getElementById('res-fecha').min = new Date().toISOString().split('T')[0];
            } catch { errorEl.textContent = 'No se pudo conectar con el servidor.'; }
        }

        async function cargarReservas() {
            const tbody = document.getElementById('tabla-reservas');
            tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">Cargando...</td></tr>';
            try {
                const filtroRestId = document.getElementById('filtro-restaurante').value;
                const fecha = document.getElementById('filtro-fecha').value;
                const turno = document.getElementById('filtro-turno').value;

                let reservas = [];
                if (filtroRestId) {
                    const res = await fetch(`${API_BASE}/reservas/restaurante/${filtroRestId}`);
                    reservas = await res.json();
                } else {
                    const promesas = todosRestaurantes.map(r => fetch(`${API_BASE}/reservas/restaurante/${r.id}`).then(r => r.json()));
                    const resultados = await Promise.all(promesas);
                    reservas = resultados.flat();
                }

                if (fecha) reservas = reservas.filter(r => r.fecha === fecha);
                if (turno) reservas = reservas.filter(r => r.turno === turno);

                if (!reservas.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">No hay reservas para ese filtro.</td></tr>'; return; }
                tbody.innerHTML = reservas.map(r => `
                    <tr>
                        <td>${r.nombreRestaurante || '—'}</td>
                        <td>${r.nombreCliente || '—'}</td>
                        <td>${r.fecha}</td>
                        <td>${r.turno === 'COMIDA' ? '🍽 Comida' : '🌙 Cena'}</td>
                        <td>${r.numComensales} personas</td>
                        <td><span class="badge badge-${r.estado.toLowerCase()}">${r.estado}</span></td>
                        <td><button class="btn-editar" onclick="abrirModal(${r.id}, '${r.estado}')">Editar estado</button></td>
                    </tr>`).join('');
            } catch { tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">Error al cargar.</td></tr>'; }
        }

        async function cargarPendientes() {
            const filtroRest = document.getElementById('filtro-restaurante').value;
            const tbody = document.getElementById('tabla-pendientes');
            const url = filtroRest
                ? `${API_BASE}/reservas/pendientes/restaurante/${filtroRest}`
                : `${API_BASE}/reservas/pendientes`;
            try {
                const res = await fetch(url);
                const pendientes = await res.json();
                if (!pendientes.length) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">No hay reservas pendientes.</td></tr>';
                    return;
                }
                tbody.innerHTML = pendientes.map(r => `
                    <tr>
                        <td>${r.nombreRestaurante}</td>
                        <td>${r.nombreCliente}</td>
                        <td>${r.fecha}</td>
                        <td>${r.turno}</td>
                        <td>${r.numComensales}</td>
                        <td>${r.observaciones || '—'}</td>
                        <td><button class="btn-editar" onclick="confirmarReserva(${r.id})">Confirmar</button></td>
                    </tr>`).join('');
            } catch { tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">Error al cargar.</td></tr>'; }
        }

        async function confirmarReserva(id) {
            await fetch(`${API_BASE}/reservas/${id}/estado`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: 'CONFIRMADA' })
            });
            cargarReservas();
            cargarPendientes();
        }

        function abrirModal(id, estadoActual) {
            reservaEditandoId = id;
            document.getElementById('nuevo-estado').value = estadoActual;
            document.getElementById('modal-estado').classList.add('open');
        }
        function cerrarModal() {
            reservaEditandoId = null;
            document.getElementById('modal-estado').classList.remove('open');
        }
        async function guardarEstado() {
            const estado = document.getElementById('nuevo-estado').value;
            await fetch(`${API_BASE}/reservas/${reservaEditandoId}/estado`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado })
            });
            cerrarModal();
            cargarReservas();
            cargarPendientes();
        }

        function cerrarSesion() { sessionStorage.removeItem('usuario'); window.location.href = 'login.html'; }
        init();
    </script>
</body>
</html>
